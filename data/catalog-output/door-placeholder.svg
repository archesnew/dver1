  <rect x="110" y="90" width="180" height="210" rx="2" fill="#FFFFFF" stroke="#E9E5DC" stroke-width="1.5"/>
  <rect x="110" y="320" width="180" height="210" rx="2" fill="#FFFFFF" stroke="#E9E5DC" stroke-width="1.5"/>
  <!-- Дверная ручка -->
  <circle cx="270" cy="330" r="6" fill="#B85C3A"/>
  <rect x="250" y="327" width="20" height="6" rx="3" fill="#B85C3A"/>
  <!-- Подпись -->
  <text x="200" y="575" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#82807A" letter-spacing="1">ДВЕРИ №1 • ФОТО ПОДГОТАВЛИВАЕТСЯ</text>
</svg>
