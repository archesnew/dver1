<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <!-- Дверная коробка -->
  <rect x="70" y="50" width="260" height="500" rx="4" fill="#FBF9F5" stroke="#E9E5DC" stroke-width="4"/>
  <!-- Дверное полотно -->
  <rect x="90" y="70" width="220" height="480" rx="2" fill="#F7F6F2" stroke="#DDD8CE" stroke-width="2"/>
